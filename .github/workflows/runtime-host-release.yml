name: Runtime host release

on:
  workflow_dispatch:
  push:
    tags:
      - "runtime-v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify tag matches Runtime version
        if: startsWith(github.ref, 'refs/tags/runtime-v')
        run: node -e "const p=require('./packages/runtime/package.json'); const expected='runtime-v'+p.version; if(process.env.GITHUB_REF_NAME!==expected){throw new Error('Tag '+process.env.GITHUB_REF_NAME+' does not match Runtime version '+expected)}"
      - run: npm run build:fresh
      - run: npm test

  package:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:fresh
      - run: npm run package:runtime-host
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-host
          path: release/runtime-host/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/runtime-v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: runtime-host
          path: release
      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Truss Runtime ${TAG#runtime-v}" --generate-notes
          gh release upload "$TAG" release/* --clobber
