<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Truss Control Center</title><link rel="stylesheet" href="./styles.css"></head><body>
<header><div><strong>TRUSS</strong><span>CONTROL CENTER · MULTI-WORKSPACE PREVIEW</span></div><button type="button" id="add-workspace">Add repository folder</button></header>
<main><aside><section><h2>Repositories</h2><div id="workspaces" class="list"></div></section><section><h2>Team</h2><div id="agents" class="list"></div></section></aside><section class="center"><div id="room" role="img" aria-label="Live multi-repository agent office"></div><p class="legend">DESKS · active repositories &nbsp; TABLE · planning agents &nbsp; FRONT · completed work &nbsp; GOLD · approval needed</p><section id="details" class="details"></section><section class="assignment"><h2>Create agent</h2><div class="grid"><label>Repository<select id="workspace"></select></label><label>Name<input id="name" value="New agent"></label><label>Mode<select id="mode"><option value="edit">Edit</option><option value="plan">Plan</option></select></label><label>Permissions<select id="approval"><option value="ask">Ask every time</option><option value="auto-read">Auto-read</option><option value="auto-all">Auto-allow</option></select></label><label>Provider<select id="provider"><option value="ollama">Ollama</option><option value="openai-compatible">OpenAI compatible</option><option value="llama-cpp">llama.cpp</option></select></label><label>Endpoint<input id="endpoint" value="http://127.0.0.1:11434"></label><label>Model<input id="model" placeholder="e.g. qwen3"></label></div><button type="button" id="create">Create agent</button></section><section class="assignment"><h2>Assignment</h2><textarea id="task" rows="4" placeholder="Select an agent, then write a focused task. Include the repository relationships it should respect."></textarea><div><button type="button" id="start">Assign task</button><button type="button" id="delete">Delete agent</button></div></section><p id="status" role="status">Add one or more repository folders, then create agents.</p></section></main><script type="module" src="./renderer.bundle.js"></script></body></html>
